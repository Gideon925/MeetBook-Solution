<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MeetBook Solutions</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #263e60);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        h2 {
            text-align: center;
            color: #152238;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #263445;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #152238;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #263e60;
        }

        .message {
            padding: 12px;
            background: #ffe5e5;
            color: #a00000;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="login-card">

        <h2>MeetBook Solutions</h2>
        <p class="subtitle">Administrator Portal</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="identifier">Email or Phone Number</label>
            <input
                type="text"
                id="identifier"
                name="identifier"
                placeholder="Administrator email or phone"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Administrator password"
                required
            >

            <button type="submit">Sign In to Admin Portal</button>
        </form>

        <p class="footer">
            Restricted access. Authorized administrators only.
        </p>

    </div>
</body>
</html>
